name: CodeTogether CI

# The "on" section tells GitHub when to run this robot.
# We want it to run whenever someone pushes code or opens a pull request to the "main" branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # This is the "job" our robot will do. We're calling it "build-and-test".
  build-and-test:
    # "ubuntu-latest" is the operating system the robot will use (a fresh Linux machine).
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download our code into the virtual machine.
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Install Node.js so we can run npm commands.
    - name: Use Node.js 22.x (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        # This speeds things up by remembering our downloaded packages for next time.
        cache: 'npm'
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json

    # Step 3: Install all frontend packages, check for errors, and try to build the UI.
    - name: Install, Lint, and Build Client
      # "working-directory" tells the robot to cd into the client folder before running these.
      working-directory: ./client
      run: |
        npm ci
        npm run lint
        npm run build

    # Step 4: Install all backend packages.
    # (If we had tests, we would run them here!)
    - name: Install Server Dependencies
      working-directory: ./server
      run: |
        npm ci
