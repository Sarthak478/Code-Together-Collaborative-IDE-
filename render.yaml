services:
  - type: web
    name: code-together-collaborative-ide
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
  - type: web
    name: codetogether-frontend
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https:; connect-src 'self' data: https: wss: ws:; img-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none';"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
